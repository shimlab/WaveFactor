site_name: WaveFactor
site_description: Bayesian factor modeling for spatial transcriptomics
repo_url: https://github.com/shimlab/WaveFactor
repo_name: shimlab/WaveFactor

theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css

nav:
  - Overview: index.md
  - Installation: installation.md
  - Data Input & Output: input_output.md
  - Getting Started: getting_started.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shimlab/WaveFactor
      name: GitHub Repository
    - icon: fontawesome/solid/robot
      link: llms.md
      name: LLM-friendly Documentation (llms.md)