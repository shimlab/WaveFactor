[build-system]
requires = ["setuptools>=77.0.0", "wheel", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "wavefactor"
dynamic = ["version"]
description = "Bayesian Multiresolution Wavelet Spatial Factor Model for Spatial Transcriptomics"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
# Bundle the licences of the vendored libraries compiled into the binary wheels
license-files = [
    "LICENSE",
    "lib/pybind11/LICENSE",
    "lib/eigen/COPYING.MPL2",
    "lib/eigen/COPYING.BSD",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "PyWavelets>=1.1.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.0.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wavefactor*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.cibuildwheel]
# Build CPython 3.10 - 3.13 binary wheels
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]
# Skip 32-bit platforms, PyPy, and musllinux
skip = ["*-win32", "*-manylinux_i686", "pp*", "*musllinux*"]

# Test every built wheel in an isolated environment before packaging
test-requires = ["pytest>=7.0.0"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
